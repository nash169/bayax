[project]
name = "bayax"
version = "1.1.0"
description = "Bayax"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chex>=0.1.90",
    "flax>=0.10.5",
    "ipympl>=0.9.7",
    "jax>=0.10.0",
    "jaxtyping>=0.3.1",
    "jupyterlab>=4.4.0",
    "jupyterlab-nvdashboard>=0.13.0",
    "jupytext>=1.19.1",
    "matplotlib>=3.10.1",
    "optax>=0.2.4",
    "scikit-image>=0.25.2",
    "tqdm>=4.67.1",
    "tueplots>=0.2.4",
]

[project.optional-dependencies]
gpu = [
    "jax[cuda13]>=0.10.0",
]
